[project]
name = "netizen-ble-patch"
version = "3.0.0"
description = "Home Assistant Pet Netizen BLE integration with a bundled patched feeder library"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "custom_components/netizen_ble"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
